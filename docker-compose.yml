# ============================================================
# docker-compose.yml
# Levanta la app (imagen unica frontend+backend) + PostgreSQL con:
#   docker compose up --build
#
# La app queda en:  http://localhost:8000
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netops
      POSTGRES_PASSWORD: netops
      POSTGRES_DB: netops
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netops"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://netops:netops@db:5432/netops
      CORS_ORIGINS: "*"
      # Cuenta de administrador (defínelas en un archivo .env junto a este docker-compose.yml).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - app_uploads:/app/app/storage/uploads
      - app_outputs:/app/app/storage/outputs

volumes:
  db_data:
  app_uploads:
  app_outputs:
